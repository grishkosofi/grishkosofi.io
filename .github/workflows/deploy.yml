name: Deploy portfolio to GitHub Pages

on:
  push:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'push' }}

jobs:
  build:
    outputs:
      should_deploy: ${{ steps.freshness.outputs.should_deploy }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check whether this run targets the latest branch commit
        id: freshness
        run: |
          target_ref="${GITHUB_REF}"
          current_sha="$(git ls-remote origin "${target_ref}" | cut -f1)"

          if [ -z "${current_sha}" ]; then
            echo "Failed to resolve ${target_ref} from origin."
            exit 1
          fi

          if [ "${current_sha}" = "${GITHUB_SHA}" ]; then
            echo "should_deploy=true" >> "${GITHUB_OUTPUT}"
          else
            echo "should_deploy=false" >> "${GITHUB_OUTPUT}"
            echo "Skipping stale workflow run for ${GITHUB_SHA} because ${target_ref} is now at ${current_sha}."
          fi

      - name: Setup Node.js
        if: steps.freshness.outputs.should_deploy == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: 20.19.0
          cache: npm

      - name: Configure GitHub Pages
        if: steps.freshness.outputs.should_deploy == 'true'
        uses: actions/configure-pages@v5

      - name: Install dependencies
        if: steps.freshness.outputs.should_deploy == 'true'
        run: npm ci

      - name: Build
        if: steps.freshness.outputs.should_deploy == 'true'
        run: npm run build

      - name: Upload artifact
        if: steps.freshness.outputs.should_deploy == 'true'
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

  deploy:
    needs: build
    if: needs.build.outputs.should_deploy == 'true'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
